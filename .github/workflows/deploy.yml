name: Deploy to GitHub Pages

# PREREQUISITE, done once by hand in the repo:
#   Settings -> Pages -> Source: "GitHub Actions"
# Without it, configure-pages fails with "Get Pages site failed ... Not Found".
# The action's `enablement: true` input looks like it would automate this, but it
# needs admin/pages-write credentials that the default GITHUB_TOKEN does not carry.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No Docs.json here — the runner has no game install. This works only because
      # public/data.json is committed; regenerate it locally after a game patch.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
